name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
