name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        attempt: [1, 2]
        browser: [chromium, firefox]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: node scripts/trace-activity-bar.mjs
      - run: npm run build
      - name: Install browser
        working-directory: ./packages/e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Trace ActivityBar editing
        working-directory: ./packages/e2e
        run: npm run e2e -- --headless --browser=${{ matrix.browser }} --filter=component-state-view.edit-live-activity-bar --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload attempt results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: activity-diagnostic-${{ matrix.browser }}-${{ matrix.attempt }}
          path: packages/e2e/renderer-worker-traces/
