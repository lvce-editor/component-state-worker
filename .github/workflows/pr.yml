name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: install playwright system dependencies
        working-directory: ./packages/e2e
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium firefox webkit
      - name: install playwright browsers
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e chromium
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e firefox
        working-directory: ./packages/e2e
        run: npm run e2e:firefox:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e webkit
        working-directory: ./packages/e2e
        run: npm run e2e:webkit:headless -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload Windows WebKit trace
        if: failure() && matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v7
        with:
          name: windows-webkit-renderer-worker-trace
          path: ./packages/e2e/renderer-worker-traces
